<!doctype html>
<html>
<head>
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/omggif@1.0.10/omggif.js"></script>
    <meta charset="UTF-8" />
    <title>Final Qs Sim</title>
</head>
<body>
    <div id="instructionsContainer">
        <ul>
            <li>Testing New Stuff Wooooo</li>
        </ul>
    </div>

    <div class="options-container">
        <div class="option-group">
            <label for="wave">Wave:</label>
            <select id="wave" autocomplete="off">
                <option value="Wave 2" selected>2</option>
                <option value="Wave 3" disabled>3</option>
            </select>
        </div>

        <div class="option-group">
            <label for="zoom">Zoom Level:</label>
            <select id="zoom" autocomplete="off">
                <option value="Low Zoom">Low</option>
                <option value="Medium Zoom" selected>Medium</option>
                <option value="High Zoom">High</option>
                <option value="Very High Zoom">Very High</option>
            </select>
        </div>

        <div class="option-group">
            <label for="highlight">Highlight Ladder:</label>
            <select id="highlight" autocomplete="off">
                <option value="Highlight" selected>On</option>
                <option value="No Highlight">Off</option>
            </select>
        </div>

        <div class="option-group">
            <label for="direction">Camera Direction:</label>
            <select id="direction" autocomplete="off">
                <option value="North" selected>North</option>
                <option value="South">South</option>
                <option value="East">East</option>
                <option value="Southeast">Southeast</option>
            </select>
        </div>

        <div class="option-group">
            <label for="height">Camera Height:</label>
            <select id="height" autocomplete="off">
                <option value="High Height" selected>High</option>
                <option value="Medium Height">Medium</option>
                <option value="Low Height">Low</option>
                <option value="Very Low Height">Very Low</option>
            </select>
        </div>

        <div class="option-group">
            <label for="tiles">Spawn Tiles:</label>
            <select id="tiles" autocomplete="off">
                <option value="Destination Qs">Dest Qs Tiles Only</option>
                <option value="No Destination Qs" selected>All Tiles</option>
            </select>
        </div>
    </div>

    <div class="slider-container">
        <div class="slider">
            <label for="ping">Ping</label>
            <input autocomplete="off" type="range" id="ping" min="0" max="400" value="50">
            <div class="values">
                <span>0</span>
                <span id="ping-value">50 ms</span>
                <span>400</span>
            </div>
        </div>

        <div class="slider">
            <label for="load-time">Load Time</label>
            <input autocomplete="off" type="range" id="load-time" min="0" max="200" step="20" value="20">
            <div class="values">
                <span>0</span>
                <span id="load-time-value">20 ms</span>
                <span>200</span>
            </div>
        </div>
    </div>

    <div id="canvasesdiv" style="position:relative; width:783px; height:566px">
        <canvas id="backgroundCanvas"
            style="z-index: 1; position:absolute; left:0px; top:0px;"
            height="565px" width="790px">
            This text is displayed if your browser does not support HTML5 Canvas.
        </canvas>
        <canvas id="inventoryCanvas"
            style="z-index: 2; position:absolute; left:553px; top:230px;"
            height="334px" width="236px">
            This text is displayed if your browser does not support HTML5 Canvas.
        </canvas>
        <canvas id="RedYellowXCanvas"
            style="z-index: 3; pointer-events: none; position: absolute; left:0px; top:0px;"
            height="565px" width="790px">
        </canvas>
        <canvas id="PointScreenCanvas"
            style="z-index: 4; pointer-events: none; position: absolute; left:0px; top:0px;"
            height="565px" width="790px">
        </canvas>
        <canvas id="XPDropCanvas"
            style="z-index: 5; pointer-events: none; position: absolute; left:0px; top:0px;"
            height="565px" width="790px">
        </canvas>
        <canvas id="inventoryUseItemCanvas"
            style="z-index: 6; pointer-events: none; position: absolute; left:553px; top:230px"
            height="334px" width="236px">
        </canvas>
        <canvas id="tickCounterCanvas"
            style="z-index: 7; position: absolute; left:700px; top:185px;"
            height="25px" width="25">
        </canvas>
    </div>
    <div id="coords"></div>
</body>
</html>
